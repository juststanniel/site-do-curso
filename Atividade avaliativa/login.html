<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="cadastro" id="cadastro">
        <h2 class="title">Faça seu cadastro aqui!</h2>
        <div class="container-form">
            <form>
                <div class="campo"><label for="nome">Nome completo:</label><input type="text" id="nome" placeholder="Digite seu nome" required></div>
                <div class="campo"><label for="email">Seu e-mail:</label><input type="email" id="email" placeholder="exemplo@gmail.com" required></div>
                <div class="campo"><label for="telefone">Telefone:</label><input type="tel" id="telefone" placeholder="(11) 99999-9999" required></div>
                <button type="submit" class="btn" style="width:100%">Enviar Cadastro</button>
            </form>
        </div>
    </section>
</body>
</html>
